name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire le projet corrige
        run: |
          unzip -q MonAgendaAlarmes-1.0.1-corrige.zip

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compiler APK
        working-directory: MonAgendaAlarmes
        run: gradle --no-daemon assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v7
        with:
          name: MonAgendaAlarmes-APK
          path: MonAgendaAlarmes/app/build/outputs/apk/debug/app-debug.apk
