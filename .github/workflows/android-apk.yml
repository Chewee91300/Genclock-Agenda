name: Construire APK Android

on:
workflow_dispatch:
inputs:
archive_name:
description: "Nom exact de l'archive (laisser vide pour prendre automatiquement la dernière version)"
required: false
type: string

push:
branches:
- main
paths-ignore:
- "Bellendar-*.zip"

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Récupérer le dépôt
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Installer Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Installer Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.9'

  - name: Sélectionner et décompresser la bonne archive
    env:
      REQUESTED_ARCHIVE: ${{ inputs.archive_name }}
    run: |
      set -euo pipefail
      mkdir -p extracted

      if [ -z "${REQUESTED_ARCHIVE:-}" ]; then
        echo "Recherche automatique de la dernière version..."

        REQUESTED_ARCHIVE=$(
          find . -maxdepth 1 -type f \
            -regextype posix-extended \
            -regex './Bellendar-[0-9]+\.[0-9]+\.[0-9]+\.zip' \
            -printf '%f\n' | sort -V | tail -n 1
        )

        if [ -z "$REQUESTED_ARCHIVE" ]; then
          echo "::error::Aucune archive Bellendar trouvée."
          exit 1
        fi
      fi

      if [[ ! "$REQUESTED_ARCHIVE" =~ ^Bellendar-[0-9]+\.[0-9]+\.[0-9]+\.zip$ ]]; then
        echo "::error::Nom d'archive invalide."
        exit 1
      fi

      if [ ! -f "$REQUESTED_ARCHIVE" ]; then
        echo "::error::Archive introuvable : $REQUESTED_ARCHIVE"
        exit 1
      fi

      PROJECT_ZIP="$REQUESTED_ARCHIVE"
      echo "ARCHIVE_SELECTIONNEE=$PROJECT_ZIP" >> "$GITHUB_ENV"

      echo "=================================="
      echo "ARCHIVE SÉLECTIONNÉE : $PROJECT_ZIP"
      echo "=================================="
      sha256sum "$PROJECT_ZIP"

      unzip -o "$PROJECT_ZIP" -d extracted

      mapfile -t PROJECT_ROOTS < <(
        find extracted -type f \
          -path "*/app/build.gradle.kts" \
          -print | sed 's|/app/build.gradle.kts$||' | sort -u
      )

      if [ "${#PROJECT_ROOTS[@]}" -ne 1 ]; then
        echo "::error::Un seul projet Android est attendu."
        printf '%s\n' "${PROJECT_ROOTS[@]}"
        exit 1
      fi

      PROJECT_ROOT="${PROJECT_ROOTS[0]}"
      cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

  - name: Vérifier le projet et afficher les sources compilées
    run: |
      set -euo pipefail

      test -f app/build.gradle.kts
      test -f settings.gradle.kts
      test -f app/src/main/java/fr/bellendar/UiTranslations.kt

      echo "Archive compilée : $ARCHIVE_SELECTIONNEE"
      sha256sum app/src/main/java/fr/bellendar/UiTranslations.kt

      echo "Version du projet :"
      grep -E 'versionCode|versionName' app/build.gradle.kts

  - name: Préparer la clé de signature persistante
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    run: |
      set -euo pipefail

      if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
        echo "::error::Secret DEBUG_KEYSTORE_BASE64 absent."
        exit 1
      fi

      mkdir -p "$HOME/.android"

      printf '%s' "$DEBUG_KEYSTORE_BASE64" \
        | base64 --decode > "$HOME/.android/debug.keystore"

      keytool -list \
        -keystore "$HOME/.android/debug.keystore" \
        -storepass android \
        -alias androiddebugkey

  # Aucune incrémentation automatique du versionCode.
  # Les valeurs présentes dans le ZIP sont conservées.
  - name: Compiler APK
    run: gradle --no-daemon :app:assembleDebug

  - name: Vérifier et renommer APK
    run: |
      set -euo pipefail

      test -f app/build/outputs/apk/debug/app-debug.apk

      cp app/build/outputs/apk/debug/app-debug.apk \
        Bellendar.apk

  - name: Publier APK
    uses: actions/upload-artifact@v7
    with:
      name: Bellendar
      path: Bellendar.apk
      if-no-files-found: error
      retention-days: 30

  - name: Nettoyer les anciennes versions ZIP
    if: success() && github.ref == 'refs/heads/main'
    shell: bash
    run: |
      set -euo pipefail

      mapfile -t VERSIONS < <(
        find . -maxdepth 1 -type f \
          -regextype posix-extended \
          -regex './Bellendar-[0-9]+\.[0-9]+\.[0-9]+\.zip' \
          -printf '%f\n' | sort -Vr
      )

      COUNT=${#VERSIONS[@]}

      if [ "$COUNT" -le 2 ]; then
        echo "Deux archives ou moins : aucune suppression."
        exit 0
      fi

      echo "Archives conservées :"
      echo "${VERSIONS[0]}"
      echo "${VERSIONS[1]}"

      for ((i=2; i<COUNT; i++)); do
        git rm -- "${VERSIONS[$i]}"
      done

      git config user.name "github-actions[bot]"
      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git commit -m "Nettoyage automatique des anciennes versions ZIP"
      git push origin HEAD:main
