name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Vérifier les modules Gradle
        run: gradle --no-daemon projects

      - name: Lister les tâches du module app
        run: gradle --no-daemon :app:tasks --all

      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Vérifier la présence de l'APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Renommer APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MonAgendaAlarmes.apk

      - name: Publier APK
        uses: actions/upload-artifact@v7
        with:
          name: MonAgendaAlarmes
          path: MonAgendaAlarmes.apk
          if-no-files-found: error
          retention-days: 7
