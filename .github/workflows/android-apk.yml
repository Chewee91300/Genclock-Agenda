
name: Construire APK Android

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: "Nom exact de l'archive à compiler (vide = dernière version)"
        required: false
        type: string
        default: ""

  push:
    branches:
      - main
    paths-ignore:
      - "Bellendar-*.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du dépôt
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Installation Java
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Installation Gradle
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # 4. Sélection automatique de la bonne archive
      - name: Sélectionner et décompresser la bonne archive
        env:
          REQUESTED_ARCHIVE: ${{ inputs.archive_name }}
        run: |
          set -euo pipefail
          mkdir -p extracted

          if [ -n "$REQUESTED_ARCHIVE" ]; then

            if [[ ! "$REQUESTED_ARCHIVE" =~ ^Bellendar-[0-9]+\.[0-9]+\.[0-9]+\.zip$ ]]; then
              echo "::error::Nom d'archive invalide."
              exit 1
            fi

            if [ ! -f "$REQUESTED_ARCHIVE" ]; then
              echo "::error::Archive introuvable : $REQUESTED_ARCHIVE"
              exit 1
            fi

            PROJECT_ZIP="$REQUESTED_ARCHIVE"

          else

            mapfile -t PROJECT_ZIPS < <(
              find . -maxdepth 1 -type f \
                -regextype posix-extended \
                -regex './Bellendar-[0-9]+\.[0-9]+\.[0-9]+\.zip' \
                -printf '%f\n' | sort -V
            )

            if [ "${#PROJECT_ZIPS[@]}" -eq 0 ]; then
              echo "::error::Aucune archive valide trouvée."
              exit 1
            fi

            PROJECT_ZIP="${PROJECT_ZIPS[-1]}"
          fi

          echo "Archive sélectionnée : $PROJECT_ZIP"

          unzip -o "$PROJECT_ZIP" -d extracted

          PROJECT_ROOT=$(find extracted -type f \
            -path "*/app/build.gradle.kts" \
            -print -quit | sed 's|/app/build.gradle.kts$||')

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Projet Android introuvable."
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

      # 5. Vérification du projet
      - name: Vérifier le projet
        run: |
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      # 6. Préparation de la clé de signature
      - name: Préparer la clé de signature persistante
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 absent."
            exit 1
          fi

          mkdir -p "$HOME/.android"

          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      # 7. Incrémentation automatique du versionCode
      - name: Incrémenter automatiquement versionCode
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")

          match = re.search(
              r"(?m)^(\s*versionCode\s*=\s*)(\d+)",
              source
          )

          if not match:
              raise SystemExit("versionCode introuvable.")

          current = int(match.group(2))
          updated = max(
              current + 1,
              int(os.environ["RUN_NUMBER"])
          )

          source = (
              source[:match.start(2)]
              + str(updated)
              + source[match.end(2):]
          )

          path.write_text(source, encoding="utf-8")

          print(f"versionCode : {current} -> {updated}")
          PY

      # 8. Compilation APK
      - name: Compiler APK
        run: |
          gradle --no-daemon :app:assembleDebug

      # 9. Vérification de l'APK
      - name: Vérifier et renommer APK
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk

          cp app/build/outputs/apk/debug/app-debug.apk \
            Bellendar.apk

      # 10. Publication de l'APK
      - name: Publier APK
        uses: actions/upload-artifact@v7
        with:
          name: Bellendar
          path: Bellendar.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Nettoyage automatique des anciennes archives
      - name: Nettoyer les anciennes versions ZIP
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          echo "Recherche des archives MonAgendaAlarmes..."

          mapfile -t VERSIONS < <(
            find . -maxdepth 1 -type f \
              -regextype posix-extended \
              -regex './Bellendar-[0-9]+\.[0-9]+\.[0-9]+\.zip' \
              -printf '%f\n' | sort -Vr
          )

          COUNT=${#VERSIONS[@]}

          echo "Nombre d'archives trouvées : $COUNT"

          if [ "$COUNT" -le 2 ]; then
            echo "Deux versions ou moins : aucune suppression."
            exit 0
          fi

          echo "Versions conservées :"
          echo "${VERSIONS[0]}"
          echo "${VERSIONS[1]}"

          for ((i=2; i<COUNT; i++)); do
            echo "Suppression : ${VERSIONS[$i]}"
            git rm -- "${VERSIONS[$i]}"
          done

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Nettoyage automatique des anciennes versions ZIP"

          git push origin HEAD:main
