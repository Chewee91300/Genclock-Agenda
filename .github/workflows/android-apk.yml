
name: Construire Mon Agenda Alarmes

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extraire le projet
        run: unzip -q MonAgendaAlarmes-1.0.3-correctifs.zip

      - name: Compiler APK
        working-directory: MonAgendaAlarmes
        run: gradle --no-daemon assembleDebug

      - name: Renommer APK
        run: cp MonAgendaAlarmes/app/build/outputs/apk/debug/app-debug.apk MonAgendaAlarmes.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: MonAgendaAlarmes
          path: MonAgendaAlarmes.apk
          if-no-files-found: error
