
name: Construire APK Android

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: "Nom exact de l'archive à compiler (vide = dernière version)"
        required: false
        type: string
        default: ""
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Sélectionner et décompresser la bonne archive
        env:
          REQUESTED_ARCHIVE: ${{ inputs.archive_name }}
        run: |
          set -euo pipefail
          mkdir -p extracted

          if [ -n "$REQUESTED_ARCHIVE" ]; then
            if [[ ! "$REQUESTED_ARCHIVE" =~ ^MonAgendaAlarmes-[0-9]+\.[0-9]+\.[0-9]+\.zip$ ]]; then
              echo "::error::Nom d'archive invalide"
              exit 1
            fi
            if [ ! -f "$REQUESTED_ARCHIVE" ]; then
              echo "::error::Archive introuvable : $REQUESTED_ARCHIVE"
              exit 1
            fi
            PROJECT_ZIP="$REQUESTED_ARCHIVE"
          else
            mapfile -t PROJECT_ZIPS < <(
              find . -maxdepth 1 -type f \
                -regextype posix-extended \
                -regex './MonAgendaAlarmes-[0-9]+\.[0-9]+\.[0-9]+\.zip' \
                -printf '%f\n' | sort -V
            )
            if [ "${#PROJECT_ZIPS[@]}" -eq 0 ]; then
              echo "::error::Aucune archive MonAgendaAlarmes-X.Y.Z.zip trouvée"
              exit 1
            fi
            PROJECT_ZIP="${PROJECT_ZIPS[-1]}"
          fi

          echo "Archive sélectionnée : $PROJECT_ZIP"
          unzip -o "$PROJECT_ZIP" -d extracted

          PROJECT_ROOT=$(find extracted -type f -path "*/app/build.gradle.kts" -print -quit | sed 's|/app/build.gradle.kts$||')
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Projet Android introuvable dans l'archive"
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

      - name: Vérifier le projet
        run: |
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Préparer la clé de signature persistante
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 absent"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Incrémenter automatiquement versionCode
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          match = re.search(r"(?m)^(\s*versionCode\s*=\s*)(\d+)", source)
          if not match:
              raise SystemExit("versionCode introuvable")
          current = int(match.group(2))
          updated = max(current + 1, int(os.environ["RUN_NUMBER"]))
          source = source[:match.start(2)] + str(updated) + source[match.end(2):]
          path.write_text(source, encoding="utf-8")
          print(f"versionCode : {current} -> {updated}")
          PY

      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Vérifier et renommer APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MonAgendaAlarmes.apk

      - name: Publier APK
        uses: actions/upload-artifact@v7
        with:
          name: MonAgendaAlarmes
          path: MonAgendaAlarmes.apk
          if-no-files-found: error
          retention-days: 30

