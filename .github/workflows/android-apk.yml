name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet Android
        run: |
          mkdir -p extracted
          PROJECT_ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort -V | tail -n 1)
          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERREUR : aucune archive ZIP du projet à la racine"
            exit 1
          fi
          echo "Archive sélectionnée : $PROJECT_ZIP"
          unzip -o "$PROJECT_ZIP" -d extracted
          PROJECT_ROOT=$(find extracted -type f -path "*/app/build.gradle.kts" -print -quit | sed 's|/app/build.gradle.kts$||')
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERREUR : app/build.gradle.kts introuvable dans le ZIP"
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          echo "Projet trouvé dans : $PROJECT_ROOT"
          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

      - name: Vérifier le projet
        run: |
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Préparer la clé de signature persistante
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 absent dans Settings > Secrets and variables > Actions"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Incrémenter automatiquement versionCode
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          match = re.search(r"(?m)^(\s*versionCode\s*=\s*)(\d+)", source)
          if not match:
              raise SystemExit("ERREUR : déclaration versionCode introuvable dans app/build.gradle.kts")
          current = int(match.group(2))
          updated = max(current + 1, int(os.environ["RUN_NUMBER"]))
          source = source[:match.start(2)] + str(updated) + source[match.end(2):]
          path.write_text(source, encoding="utf-8")
          print(f"versionCode : {current} -> {updated}")
          PY

      - name: Compiler APK signée avec la clé persistante
        run: gradle --no-daemon :app:assembleDebug

      - name: Vérifier et renommer APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MonAgendaAlarmes.apk

      - name: Publier APK
        uses: actions/upload-artifact@v7
        with:
          name: MonAgendaAlarmes
          path: MonAgendaAlarmes.apk
          if-no-files-found: error
          retention-days: 30
