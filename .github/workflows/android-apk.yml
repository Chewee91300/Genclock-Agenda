
name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: unzip -q MonAgendaAlarmes_ProjetAndroid.zip -d extracted

      - name: Compiler APK
        run: |
          cd extracted/MonAgendaAlarmes
          gradle --no-daemon assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: MonAgendaAlarmes-APK
          path: extracted/MonAgendaAlarmes/app/build/outputs/apk/debug/app-debug.apk
