name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet Android
        run: |
          mkdir -p extracted
          unzip -o MonAgendaAlarmes-2.1.9.zip -d extracted

          PROJECT_ROOT=$(find extracted -type f \
            -path "*/app/build.gradle.kts" \
            -print -quit | sed 's|/app/build.gradle.kts$||')

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERREUR : app/build.gradle.kts introuvable dans le ZIP"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Projet trouvé dans : $PROJECT_ROOT"
          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

      - name: Vérifier le projet
        run: |
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          echo "Projet Android détecté"

      - name: Vérifier les tâches Gradle
        run: gradle --no-daemon :app:tasks --all

      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Vérifier APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Renommer APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MonAgendaAlarmes.apk

      - name: Publier APK
        uses: actions/upload-artifact@v7
        with:
          name: MonAgendaAlarmes
          path: MonAgendaAlarmes.apk
          if-no-files-found: error
          retention-days: 7
