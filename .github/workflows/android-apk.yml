      - name: Extraire le projet
        run: unzip -q MonAgendaAlarmes-1.0.2-alarme-integree.zip

      - name: Compiler APK
        working-directory: MonAgendaAlarmes
        run: gradle --no-daemon assembleDebug

      - name: Renommer APK
        run: cp MonAgendaAlarmes/app/build/outputs/apk/debug/app-debug.apk MonAgendaAlarmes.apk

      - name: Publier APK
        uses: actions/upload-artifact@v7
        with:
          name: MonAgendaAlarmes
          path: MonAgendaAlarmes.apk
